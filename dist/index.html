<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <meta name="description" content="격자를 눌러 쌓고, 설명을 읽고, 나만의 쌓기나무 작품을 만들어요.">
  <title>쌓기나무 놀이터</title>
  <link rel="stylesheet" href="style.css">
  <script src="drawing.js" defer></script>
  <script src="art.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="mast">
    <a href="#home" class="brand"><span class="logo" id="logo" aria-hidden="true"></span>쌓기나무 놀이터</a>
    <span class="subject">초등 2학년 수학</span>
  </header>
  <main>
    <section id="home" aria-labelledby="home-title">
      <div class="hero">
        <div class="hero-copy">
          <h1 id="home-title" tabindex="-1">쌓기나무<br><em>놀이터</em></h1>
          <p>나무를 쌓고, 모양을 말하고,<br>나만의 작품을 만들어 봐요.</p>
        </div>
        <svg id="village" viewBox="0 0 540 320" role="img" aria-label="나무색, 빨간색, 노란색 쌓기나무로 만든 작은 성"></svg>
      </div>
      <nav class="choices" aria-label="활동 고르기">
        <a href="#practice" class="choice practice"><span class="activity-icon" data-icon="practice"></span><strong>연습하기</strong><span>격자를 눌러 차곡차곡 쌓아요.</span></a>
        <a href="#quiz" class="choice quiz"><span class="activity-icon" data-icon="quiz"></span><strong>퀴즈풀기</strong><span>설명을 읽고 모양을 만들어요.</span></a>
        <a href="#art" class="choice art"><span class="activity-icon" data-icon="art"></span><strong>작품 만들기</strong><span>블록을 끌어 자유롭게 붙여요.</span></a>
      </nav>
    </section>
    <section id="workshop" hidden aria-labelledby="activity-title">
      <div class="activity-heading">
        <div><a class="back" href="#home">처음 화면</a><h1 id="activity-title" tabindex="-1"></h1></div>
        <p id="instruction"></p>
      </div>
      <div class="layout">
        <div class="bench">
          <div class="bench-head"><h2 id="board-title">쌓기판</h2><span id="count"></span></div>
          <svg id="board" viewBox="0 0 560 380" role="group" aria-labelledby="board-title"></svg>
          <div class="bench-foot"><span id="orientation"></span><button id="view-toggle" type="button">위에서 보기</button></div>
        </div>
        <aside class="tools">
          <div id="question" hidden>
            <span id="progress"></span><h2>설명 카드</h2><p id="prompt"></p>
          </div>
          <h2 id="palette-title">블록 고르기</h2>
          <div id="palette" role="group" aria-labelledby="palette-title"></div>
          <div class="modes" id="modes" role="group" aria-label="쌓기 도구">
            <button data-mode="add" aria-pressed="true">쌓기</button>
            <button data-mode="remove" aria-pressed="false">빼기</button>
          </div>
          <div id="quiz-actions" hidden>
            <button class="primary" id="check">정답 확인</button><button id="hint">힌트</button>
            <button class="primary" id="next" hidden>다음 문제</button>
          </div>
          <p id="feedback" role="status" aria-live="polite"></p>
          <div class="secondary"><button id="undo">한 번 되돌리기</button><button id="clear">모두 비우기</button></div>
        </aside>
      </div>
      <p id="reflect" class="reflect"></p>
    </section>
  </main>
  <footer><span>초등 수학 · 도형과 측정</span><span>[2수03-02] 입체도형의 모양</span></footer>
</body>
</html>
